name: release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.20.1'
      - name: Use Go Action
        id: use-go-action
        # release-action only exists on gitea.com, not on github.com,
        # so it needs the full URL (DEFAULT_ACTIONS_URL=github would 404).
        uses: https://gitea.com/actions/release-action@main
        with:
          files: |-
            CHANGELOG.md
          api_key: '${{ secrets.TOKEN }}'
          body: |
            > :bulb: **Note:** See [CHANGELOG.md](src/branch/main/CHANGELOG.md) for recent changes.
